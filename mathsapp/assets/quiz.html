<!DOCTYPE html>
<html lang="fr" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="__ASSETS__/vendor/katex/katex.min.css">
<link rel="stylesheet" href="__ASSETS__/course.css">
<style>
  body { font-size: 15.5px; }
  #shell { max-width: 720px; margin: 0 auto; padding: 26px 26px 90px; }
  .qhead {
    display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; color: var(--muted);
  }
  .qhead .bar { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .qhead .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
  .diff { letter-spacing: 1.5px; color: var(--warn); font-size: 13px; }
  .clock {
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 600;
    color: var(--accent); background: var(--accent-soft);
    padding: 2px 9px; border-radius: 999px;
  }
  .qtext { font-size: 1.06em; margin-bottom: 20px; }
  .qtext p:first-child { margin-top: 0; }
  .choice {
    display: flex; gap: 11px; align-items: flex-start;
    border: 1.5px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 9px; cursor: pointer;
    transition: border-color .12s, background .12s;
    font-family: inherit;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .k {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--line-strong); color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .choice .c > :first-child { margin-top: 0; }
  .choice .c > :last-child { margin-bottom: 0; }
  .choice.sel { border-color: var(--accent); background: var(--accent-soft); }
  .choice.sel .k { border-color: var(--accent); color: var(--accent); }
  .choice.good { border-color: var(--ok); background: var(--ok-soft); }
  .choice.good .k { border-color: var(--ok); color: var(--ok); background: transparent; }
  .choice.bad { border-color: var(--warn); background: var(--warn-soft); }
  .choice.bad .k { border-color: var(--warn); color: var(--warn); }
  .choice.locked { cursor: default; }
  .verdict {
    margin: 18px 0 0; padding: 13px 15px; border-radius: 10px;
    border-left: 3px solid var(--accent); background: var(--bg-soft);
  }
  .verdict .vtitle {
    font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 700;
    font-size: .78em; letter-spacing: .07em; text-transform: uppercase; margin-bottom: .4em;
  }
  .verdict.ok { border-left-color: var(--ok); }
  .verdict.ok .vtitle { color: var(--ok); }
  .verdict.ko { border-left-color: var(--warn); }
  .verdict.ko .vtitle { color: var(--warn); }
  .actions { display: flex; gap: 10px; margin-top: 24px; align-items: center; flex-wrap: wrap; }
  button.btn {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13.5px; font-weight: 600;
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--bg-soft); color: var(--fg); cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.08); color: #fff; }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.btn.ghost:hover { color: var(--accent); }
  /* ------------------------------------------------------------ menu */
  .sets { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .set-tab {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; font-weight: 600;
    padding: 5px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .set-tab:hover { color: var(--fg); border-color: var(--line-strong); }
  .set-tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .set-tab.add { border-style: dashed; }
  .menu-sum {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    color: var(--muted); margin-bottom: 12px;
  }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .qrow {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 9px 10px; border-radius: 9px; border: 1px solid transparent;
    cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .qrow:hover { background: var(--bg-soft); }
  .qrow.sel { background: var(--accent-soft); border-color: var(--line); }
  .qrow .box {
    flex: none; width: 15px; height: 15px; margin-top: 3px; border-radius: 4px;
    border: 1.5px solid var(--line-strong); display: flex; align-items: center;
    justify-content: center; font-size: 10px; color: #fff;
  }
  .qrow.sel .box { background: var(--accent); border-color: var(--accent); }
  .qrow .txt { flex: 1; min-width: 0; font-size: .95em; line-height: 1.45; }
  .qrow .meta {
    display: flex; gap: 9px; align-items: center; margin-top: 3px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; color: var(--muted);
  }
  .pill {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line);
  }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.ko { color: var(--warn); border-color: var(--warn); }
  .pill.new { color: var(--muted); }
  .pill.ex { color: var(--violet); border-color: var(--violet); }
  .sticky-go {
    position: sticky; bottom: 0; padding: 14px 0; margin-top: 10px;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    display: flex; gap: 10px; align-items: center;
  }
  /* --------------------------------------------------------- exercice */
  .exo-note {
    margin: 0 0 14px; padding: 9px 13px; border-radius: 9px;
    border-left: 3px solid var(--violet); background: var(--violet-soft);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; color: var(--fg-soft);
  }
  #scratch {
    width: 100%; min-height: 130px; resize: vertical; margin-bottom: 14px;
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.55;
    padding: 10px 12px; border-radius: 9px; border: 1.5px dashed var(--line-strong);
    background: var(--bg-soft); color: var(--fg);
  }
  #scratch:focus { outline: none; border-color: var(--accent); border-style: solid; }
  .course-score {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    color: var(--fg-soft); background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 16px; display: inline-block; margin-bottom: 18px;
  }
  #result { text-align: center; padding: 40px 0 20px; }
  #result .big { font-size: 3.4em; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
  #result .sub { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; margin-top: .3em; }
  .breakdown {
    margin: 30px auto 0; max-width: 460px;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
  }
  .brow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .brow .lvl { color: var(--muted); flex: 0 0 92px; }
  .brow .bb { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .brow .bb > i { display: block; height: 100%; background: var(--ok); }
  .brow .n { flex: 0 0 44px; text-align: right; color: var(--fg-soft); }
  .missed { margin-top: 26px; }
  .missed h4 { font-size: .95em; margin-bottom: .5em; }
  .missed a { display: block; padding: 5px 0; cursor: pointer; font-size: .95em; }
  /* ------------------------------------------------ tentative en cours */
  .resume-box {
    margin: 0 0 18px; padding: 13px 15px; border-radius: 10px;
    border: 1px solid var(--accent); background: var(--accent-soft);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; color: var(--fg-soft);
  }
  .resume-box.stale { border-color: var(--warn); background: var(--warn-soft); }
  .resume-box .actions { margin-top: 10px; }
  .resume-box b { color: var(--fg); }
  #shell.resume-only { padding-top: 60px; }
  button.btn.danger { border-color: var(--warn); color: var(--warn); }
</style>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="__ASSETS__/vendor/katex/katex.min.js"></script>
<script src="__ASSETS__/vendor/katex/contrib/auto-render.min.js"></script>
</head>
<body>
<div id="shell"></div>
<script>
var SETS = __SETS__;
var HISTORY = __HISTORY__;
var DATA = { qcm: [] };
var bridge = null;
var MACROS = {
  '\\R': '\\mathbb{R}', '\\N': '\\mathbb{N}', '\\Z': '\\mathbb{Z}',
  '\\Q': '\\mathbb{Q}', '\\C': '\\mathbb{C}', '\\E': '\\mathbb{E}',
  '\\P': '\\mathbb{P}', '\\1': '\\mathbf{1}',
  '\\norm': '\\left\\lVert #1 \\right\\rVert', '\\abs': '\\left| #1 \\right|',
  '\\scal': '\\left\\langle #1 , #2 \\right\\rangle',
  '\\argmin': '\\operatorname{arg\\,min}', '\\argmax': '\\operatorname{arg\\,max}',
  '\\Var': '\\operatorname{Var}', '\\Cov': '\\operatorname{Cov}',
  '\\rank': '\\operatorname{rang}', '\\tr': '\\operatorname{tr}',
  '\\diag': '\\operatorname{diag}', '\\Id': '\\mathrm{Id}',
  '\\dd': '\\mathrm{d}', '\\eps': '\\varepsilon'
};
function typeset(n) {
  if (typeof renderMathInElement === 'undefined') return;
  renderMathInElement(n, {
    delimiters: [{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},
                 {left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],
    ignoredTags: ['script','noscript','style','textarea','pre','code'],
    throwOnError: false, strict: false, output: 'html', macros: MACROS
  });
}
if (typeof QWebChannel !== 'undefined' && window.qt && window.qt.webChannelTransport) {
  new QWebChannel(window.qt.webChannelTransport,
    function (ch) { bridge = ch.objects.app; window.app = bridge; });
}

var shell = document.getElementById('shell');
var idx = 0, answers = [], validated = false, chosen = -1;
var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
var SESSION = window.SESSION || null;   // seance transversale, le cas echeant
var timerStart = 0, timerId = null;
var setIndex = 0;          // serie courante
var selection = [];        // indices des questions retenues
var partial = false;       // session sur une selection seulement
var reported = false;      // fin de tentative deja transmise : jamais deux fois
// Tentatives en cours, par serie : ecrites a chaque reponse validee.
var PROGRESS = (window.QUIZ_PROGRESS && typeof window.QUIZ_PROGRESS === 'object')
  ? window.QUIZ_PROGRESS : {};
var COURSE_ID = window.QUIZ_COURSE || null;

function currentSet() { return SETS[setIndex] || { id: '1', title: '', qcm: [] }; }
function hist(qid) {
  var h = HISTORY[currentSet().id] || {};
  return h[qid] || null;
}
function statusOf(q) {
  var h = hist(q.id);
  if (!h || !h.tries) return 'new';
  return h.ok ? 'ok' : 'ko';
}
function plain(html) {
  var d = document.createElement('div');
  d.innerHTML = html;
  return d.innerText.trim();
}

// ----------------------------------------------------- tentative en cours
// Empreinte d'une question : une serie regeneree peut reutiliser les memes
// identifiants pour d'autres questions, dont les anciennes reponses ne valent rien.
function sig(q) {
  var s = String(q.question) + '|' + (q.choices || []).join('|') + '|' + q.answer, h = 5381;
  for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function firstUnanswered() {
  for (var i = 0; i < DATA.qcm.length; i++) if (!answers[i]) return i;
  return -1;
}
function elapsedSeconds() {
  return timerStart ? Math.round((Date.now() - timerStart) / 1000) : 0;
}

function saveProgress() {
  var set = currentSet();
  var list = DATA.qcm.map(function (_q, i) { return answers[i] || null; });
  var done = list.filter(function (a) { return a; });
  var correct = done.filter(function (a) { return a.ok; }).length;
  var state = {
    v: 1, setId: set.id, courseId: COURSE_ID, session: SESSION ? SESSION.kind : null,
    partial: partial,
    order: DATA.qcm.map(function (q) { return q.id; }),
    sigs: DATA.qcm.map(sig),
    refs: DATA.qcm.map(function (q) {
      return { id: q.id, courseId: q.course_id || null, setId: q.set_id || null, day: q.day || null };
    }),
    // les propositions sont affichees dans l'ordre de la serie
    choiceOrder: DATA.qcm.map(function (q) { return q.choices.map(function (_c, i) { return i; }); }),
    answers: list,
    answered: done.length, total: DATA.qcm.length, correct: correct,
    score: done.length ? Math.round(100 * correct / done.length) : 0,
    seconds: elapsedSeconds(),
    savedAt: Date.now() / 1000
  };
  PROGRESS[set.id] = state;
  if (bridge && bridge.saveQuizProgress) bridge.saveQuizProgress(JSON.stringify(state));
}

function clearProgress(setId) {
  delete PROGRESS[setId];
  if (bridge && bridge.clearQuizProgress) bridge.clearQuizProgress(String(setId));
}

/* Ce qui reste reprenable d'une tentative : les questions encore presentes et
   inchangees, avec leurs reponses. null si plus rien ne correspond. */
function restorable(state, qs) {
  if (!state || !state.order || !qs) return null;
  var byId = {};
  qs.forEach(function (q) { byId[q.id] = q; });
  var qcm = [], list = [], kept = 0;
  state.order.forEach(function (id, i) {
    var q = byId[id];
    if (!q) return;
    var a = (state.answers || [])[i];
    var same = !state.sigs || state.sigs[i] === sig(q);
    qcm.push(q);
    if (a && same && a.chosen >= 0 && a.chosen < q.choices.length) {
      list[qcm.length - 1] = a;
      kept++;
    }
  });
  if (!kept) return null;
  var next = -1;
  for (var i = 0; i < qcm.length; i++) if (!list[i]) { next = i; break; }
  return { qcm: qcm, answers: list, kept: kept, next: next };
}

function resumeAttempt(state, info) {
  DATA = { qcm: info.qcm };
  answers = info.answers;
  partial = !!state.partial || info.qcm.length < currentSet().qcm.length;
  reported = false;
  idx = info.next >= 0 ? info.next : DATA.qcm.length;
  timerStart = (SESSION && SESSION.timed) ? Date.now() - (state.seconds || 0) * 1000 : 0;
  document.getElementById('shell').classList.remove('resume-only');
  render();
  window.scrollTo(0, 0);
}

function when(ts) {
  if (!ts) return '';
  var s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "à l'instant";
  if (s < 3600) return 'il y a ' + Math.floor(s / 60) + ' min';
  if (s < 86400) return 'il y a ' + Math.floor(s / 3600) + ' h';
  var d = Math.floor(s / 86400);
  return d === 1 ? 'hier' : 'il y a ' + d + ' jours';
}

/* Encart « Reprendre (question k/n) » / « Recommencer ». `onRestart` est
   appele une fois l'effacement confirme. */
function resumeBoxHtml(state, info) {
  if (!info) {
    return '<div class="resume-box stale" id="resumebox">Une tentative était en cours sur '
      + 'cette série, mais la série a changé depuis : elle ne peut pas être reprise.'
      + '<div class="actions"><button class="btn" id="restart">Recommencer</button></div></div>';
  }
  var n = info.qcm.length;
  var correct = info.answers.filter(function (a) { return a && a.ok; }).length;
  var k = info.next >= 0 ? info.next + 1 : n;
  return '<div class="resume-box" id="resumebox"><b>Tentative en cours</b> : '
    + info.kept + ' réponse' + (info.kept > 1 ? 's' : '') + ' sur ' + n
    + ' &nbsp;·&nbsp; ' + correct + ' juste' + (correct > 1 ? 's' : '')
    + (state.savedAt ? ' &nbsp;·&nbsp; ' + when(state.savedAt) : '')
    + (info.kept < (state.answered || 0) ? '<br>La série a changé : seules les réponses aux '
       + 'questions encore présentes sont conservées.' : '')
    + '<div class="actions"><button class="btn primary" id="resume">'
    + (info.next >= 0 ? 'Reprendre (question ' + k + '/' + n + ')' : 'Reprendre (voir le résultat)')
    + '</button><button class="btn" id="restart">Recommencer</button></div></div>';
}

function wireResumeBox(state, info, onRestart) {
  var resume = document.getElementById('resume');
  if (resume) resume.addEventListener('click', function () { resumeAttempt(state, info); });
  var restart = document.getElementById('restart');
  if (restart) restart.addEventListener('click', function () {
    // effacement confirme par un second clic
    if (!restart.classList.contains('danger')) {
      restart.classList.add('danger');
      restart.textContent = 'Confirmer : effacer la tentative';
      return;
    }
    clearProgress(state.setId || currentSet().id);
    onRestart();
  });
}

function stars(n) { return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n)); }
function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function renderMenu() {
  var set = currentSet();
  var qs = set.qcm;
  var counts = { ok: 0, ko: 0, new: 0 };
  qs.forEach(function (q) { counts[statusOf(q)]++; });

  var h = '<div class="sets">';
  SETS.forEach(function (s, i) {
    h += '<button class="set-tab' + (i === setIndex ? ' on' : '') + '" data-set="' + i + '">'
      + esc(s.title) + ' <span style="opacity:.65">' + s.qcm.length + '</span>'
      + (PROGRESS[s.id] ? ' <span title="tentative en cours">· en cours</span>' : '')
      + '</button>';
  });
  h += '<button class="set-tab add" id="newset">+ Nouvelle série</button></div>';

  var pending = PROGRESS[set.id] || null;
  var pendingInfo = pending ? restorable(pending, qs) : null;
  if (pending) h += resumeBoxHtml(pending, pendingInfo);

  h += '<div class="menu-sum">' + qs.length + ' questions &nbsp;·&nbsp; '
    + counts.ok + ' réussies &nbsp;·&nbsp; ' + counts.ko + ' ratées &nbsp;·&nbsp; '
    + counts.new + ' jamais faites</div>';

  h += '<div class="quick">'
    + '<button class="btn" data-pick="all">Tout sélectionner</button>'
    + (counts.ko ? '<button class="btn" data-pick="ko">Mes erreurs (' + counts.ko + ')</button>' : '')
    + (counts.new ? '<button class="btn" data-pick="new">Jamais faites (' + counts.new + ')</button>' : '')
    + '<button class="btn ghost" data-pick="none">Tout désélectionner</button>'
    + '</div>';

  qs.forEach(function (q, i) {
    var st = statusOf(q);
    var label = { ok: 'réussie', ko: 'ratée', new: 'jamais faite' }[st];
    var h2 = hist(q.id);
    h += '<div class="qrow' + (selection.indexOf(i) >= 0 ? ' sel' : '') + '" data-i="' + i + '">'
      + '<span class="box">✓</span><div class="txt">' + q.question
      + '<div class="meta"><span class="diff">' + stars(q.difficulty) + '</span>'
      + '<span class="pill ' + st + '">' + label + '</span>'
      + (q.kind === 'exercice' ? '<span class="pill ex">exercice</span>' : '')
      + (h2 && h2.tries > 1 ? '<span>' + h2.okCount + '/' + h2.tries + '</span>' : '')
      + (q.section ? '<span>' + esc(q.section) + '</span>' : '')
      + '</div></div></div>';
  });

  h += '<div class="sticky-go"><button class="btn primary" id="go">Commencer</button>'
    + '<span id="gocount" style="color:var(--muted);font-size:13px"></span></div>';

  shell.innerHTML = h;
  typeset(shell);
  updateGo();
  if (pending) wireResumeBox(pending, pendingInfo, function () { renderMenu(); });

  Array.prototype.forEach.call(shell.querySelectorAll('.qrow'), function (el) {
    el.addEventListener('click', function () {
      var i = parseInt(el.getAttribute('data-i'), 10);
      var at = selection.indexOf(i);
      if (at >= 0) selection.splice(at, 1); else selection.push(i);
      el.classList.toggle('sel');
      updateGo();
    });
  });
  Array.prototype.forEach.call(shell.querySelectorAll('[data-pick]'), function (b) {
    b.addEventListener('click', function () {
      var mode = b.getAttribute('data-pick');
      selection = [];
      qs.forEach(function (q, i) {
        if (mode === 'all' || (mode === 'ko' && statusOf(q) === 'ko')
            || (mode === 'new' && statusOf(q) === 'new')) selection.push(i);
      });
      renderMenu();
    });
  });
  Array.prototype.forEach.call(shell.querySelectorAll('[data-set]'), function (b) {
    b.addEventListener('click', function () {
      setIndex = parseInt(b.getAttribute('data-set'), 10);
      selection = [];
      renderMenu();
    });
  });
  document.getElementById('newset').addEventListener('click', function () {
    if (bridge) bridge.newQuizSet();
    this.textContent = 'Série demandée…';
    this.disabled = true;
  });
  document.getElementById('go').addEventListener('click', function () {
    // une nouvelle tentative remplace celle en cours : on le fait confirmer
    var go = document.getElementById('go');
    if (PROGRESS[set.id] && !go.classList.contains('danger')) {
      go.classList.add('danger');
      go.textContent = 'Confirmer : effacer la tentative en cours et commencer';
      return;
    }
    if (PROGRESS[set.id]) clearProgress(set.id);
    startQuiz();
  });
}

function updateGo() {
  var go = document.getElementById('go');
  var count = document.getElementById('gocount');
  if (!go) return;
  go.classList.remove('danger');
  go.disabled = selection.length === 0;
  go.textContent = selection.length === currentSet().qcm.length
    ? 'Faire la série entière' : 'Commencer (' + selection.length + ')';
  count.textContent = selection.length ? '' : 'choisissez au moins une question';
}

function startQuiz() {
  if (!selection.length) return;
  reported = false;
  var qs = currentSet().qcm;
  selection.sort(function (a, b) { return a - b; });
  DATA = { qcm: selection.map(function (i) { return qs[i]; }) };
  partial = selection.length < qs.length;
  idx = 0; answers = [];
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (idx >= DATA.qcm.length) {
    // tentative reprise : une question sautee reste a faire avant le resultat
    var gap = firstUnanswered();
    if (gap < 0) return renderResult();
    idx = gap;
  }
  var q = DATA.qcm[idx];
  var correct = answers.filter(function (a) { return a && a.ok; }).length;
  var h = '';
  h += '<div class="qhead">';
  h += '<span>Question ' + (idx + 1) + ' / ' + DATA.qcm.length + '</span>';
  if (SESSION && SESSION.timed) h += '<span id="clock" class="clock">0:00</span>';
  h += '<span class="bar"><i style="width:' + (100 * idx / DATA.qcm.length) + '%"></i></span>';
  h += '<span class="diff" title="difficulté">' + stars(q.difficulty) + '</span>';
  h += '<span>' + correct + ' bonne' + (correct > 1 ? 's' : '') + '</span>';
  h += '</div>';
  if (q.section) h += '<p style="margin:-10px 0 14px"><span class="badge">' + esc(q.section) + '</span></p>';
  var isExo = q.kind === 'exercice';
  if (isExo) {
    h += '<div class="exo-note">Exercice : à chercher pour de bon avant de regarder '
      + 'les propositions. Elles ne donnent que le résultat final.</div>';
  }
  h += '<div class="qtext">' + q.question + '</div>';
  if (isExo) h += '<textarea id="scratch" placeholder="Brouillon — vos calculs, effacé en changeant de question."></textarea>';
  h += '<div id="choices"' + (isExo ? ' hidden' : '') + '>';
  q.choices.forEach(function (c, i) {
    h += '<div class="choice" data-i="' + i + '"><span class="k">' + LETTERS[i] + '</span><div class="c">' + c + '</div></div>';
  });
  h += '</div><div id="verdict"></div>';
  h += '<div class="actions">';
  if (isExo) h += '<button class="btn" id="reveal">Afficher les propositions</button>';
  h += '<button class="btn primary" id="go"' + (isExo ? ' hidden' : '') + ' disabled>Valider</button>';
  h += '<button class="btn ghost" id="ask">Demander à Claude</button>';
  if (idx > 0) h += '<button class="btn ghost" id="prev">Question précédente</button>';
  if (!SESSION) h += '<button class="btn ghost" id="back">Retour à la liste</button>';
  h += '</div>';
  shell.innerHTML = h;
  typeset(shell);

  chosen = -1; validated = false;
  var prevBtn = document.getElementById('prev');
  if (prevBtn) prevBtn.addEventListener('click', function () {
    idx = Math.max(0, idx - 1); render(); window.scrollTo(0, 0);
  });
  Array.prototype.forEach.call(shell.querySelectorAll('.choice'), function (el) {
    el.addEventListener('click', function () {
      if (validated) return;
      Array.prototype.forEach.call(shell.querySelectorAll('.choice'), function (o) { o.classList.remove('sel'); });
      el.classList.add('sel');
      chosen = parseInt(el.getAttribute('data-i'), 10);
      document.getElementById('go').disabled = false;
    });
  });
  document.getElementById('go').addEventListener('click', onGo);
  var backBtn = document.getElementById('back');
  if (backBtn) backBtn.addEventListener('click', function () {
    renderMenu(); window.scrollTo(0, 0);
  });
  if (SESSION && SESSION.timed) {
    var clock = document.getElementById('clock');
    if (clock) {
      if (!timerStart) timerStart = Date.now();
      clearInterval(timerId);
      timerId = setInterval(function () {
        var el = document.getElementById('clock');
        if (!el) { clearInterval(timerId); return; }
        var t = Math.floor((Date.now() - timerStart) / 1000);
        el.textContent = Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
      }, 250);
    }
  }
  var revealBtn = document.getElementById('reveal');
  if (revealBtn) {
    revealBtn.addEventListener('click', function () {
      document.getElementById('choices').hidden = false;
      document.getElementById('go').hidden = false;
      this.remove();
    });
  }
  document.getElementById('ask').addEventListener('click', function () {
    if (!bridge) return;
    var el = document.createElement('div');
    el.innerHTML = q.question;
    bridge.askAbout('À propos de cette question de QCM :\n\n' + el.innerText.trim()
      + '\n\nPropositions :\n' + q.choices.map(function (c, i) {
        var d = document.createElement('div'); d.innerHTML = c;
        return LETTERS[i] + '. ' + d.innerText.trim();
      }).join('\n'), q.section || '');
  });
  // question deja repondue (retour en arriere, tentative reprise) : correction visible
  if (answers[idx]) showVerdict(q, answers[idx], true);
}

function showVerdict(q, a, revisit) {
  validated = true;
  chosen = a.chosen;
  var ok = !!a.ok;
  document.getElementById('choices').hidden = false;
  var revealBtn = document.getElementById('reveal');
  if (revealBtn) revealBtn.remove();
  var scratch = document.getElementById('scratch');
  if (scratch && revisit) scratch.remove();
  Array.prototype.forEach.call(shell.querySelectorAll('.choice'), function (el) {
    var i = parseInt(el.getAttribute('data-i'), 10);
    el.classList.add('locked');
    el.classList.remove('sel');
    if (i === q.answer) el.classList.add('good');
    else if (i === a.chosen) el.classList.add('bad');
  });
  var v = document.getElementById('verdict');
  v.innerHTML = '<div class="verdict ' + (ok ? 'ok' : 'ko') + '">'
    + '<div class="vtitle">' + (ok ? 'Correct' : 'Réponse : ' + LETTERS[q.answer]) + '</div>'
    + q.explanation + '</div>';
  typeset(v);
  var go = document.getElementById('go');
  go.hidden = false;
  go.disabled = false;
  var last = idx + 1 >= DATA.qcm.length;
  var rest = answers.filter(function (x) { return x; }).length;
  go.textContent = !last ? 'Question suivante'
    : (rest >= DATA.qcm.length || reported ? 'Voir le résultat' : 'Question sans réponse');
}

function onGo() {
  var q = DATA.qcm[idx];
  if (!validated) {
    if (chosen < 0) return;
    answers[idx] = { id: q.id, chosen: chosen, ok: chosen === q.answer,
                     difficulty: q.difficulty, kind: q.kind || 'direct',
                     courseId: q.course_id || null };
    showVerdict(q, answers[idx]);
    // ecriture immediate : quitter la page ne perd plus rien
    if (!reported) saveProgress();
  } else {
    idx++;
    render();
  }
}

function renderResult() {
  var total = DATA.qcm.length;
  var correct = answers.filter(function (a) { return a && a.ok; }).length;
  var pct = Math.round(100 * correct / total);
  var byLevel = {};
  answers.forEach(function (a) {
    if (!a) return;
    var b = byLevel[a.difficulty] = byLevel[a.difficulty] || { n: 0, ok: 0 };
    b.n++; if (a.ok) b.ok++;
  });
  var h = '<div id="result"><div id="coursescore"></div><div class="big" style="color:' +
    (pct >= 80 ? 'var(--ok)' : pct >= 50 ? 'var(--warn)' : 'var(--pink)') + '">' + pct + ' %</div>';
  h += '<div class="sub">' + correct + ' bonnes réponses sur ' + total + '</div></div>';
  h += '<div class="breakdown">';
  [1, 2, 3, 4, 5].forEach(function (d) {
    var b = byLevel[d];
    if (!b) return;
    h += '<div class="brow"><span class="lvl">' + stars(d) + '</span>'
      + '<span class="bb"><i style="width:' + (100 * b.ok / b.n) + '%"></i></span>'
      + '<span class="n">' + b.ok + '/' + b.n + '</span></div>';
  });
  h += '</div>';
  var missed = [];
  answers.forEach(function (a, i) { if (a && !a.ok) missed.push(i); });
  if (missed.length) {
    h += '<div class="breakdown missed"><h4>À revoir</h4>';
    missed.forEach(function (i) {
      var d = document.createElement('div');
      d.innerHTML = DATA.qcm[i].question;
      var txt = d.innerText.trim();
      h += '<a data-jump="' + i + '">' + esc(txt.slice(0, 110)) + (txt.length > 110 ? '...' : '') + '</a>';
    });
    h += '</div>';
  }
  h += '<div class="actions" style="justify-content:center">'
    + (SESSION ? '' : '<button class="btn primary" id="menu">Retour à la liste</button>')
    + (missed.length ? '<button class="btn" id="redo">Refaire mes ' + missed.length + ' erreurs</button>' : '')
    + '<button class="btn" id="again">Recommencer</button>'
    + (missed.length ? '<button class="btn ghost" id="review">Revoir mes erreurs avec Claude</button>' : '')
    + '</div>';
  shell.innerHTML = h;
  typeset(shell);
  clearInterval(timerId);
  var seconds = timerStart ? Math.round((Date.now() - timerStart) / 1000) : 0;
  // Chaque reponse ne compte qu'une fois : revenir sur une question depuis le
  // resultat puis revenir ici ne renvoie pas la tentative.
  if (!reported) {
    reported = true;
    delete PROGRESS[currentSet().id];   // effacee cote application a l'enregistrement
    if (bridge) bridge.quizFinished(JSON.stringify({
      total: total, correct: correct, answers: answers,
      setId: currentSet().id, partial: partial,
      session: SESSION ? SESSION.kind : null, seconds: seconds
    }));
    answers.forEach(function (a) {
      if (!a) return;
      var store = HISTORY[currentSet().id] = HISTORY[currentSet().id] || {};
      var prev = store[a.id] || { tries: 0, okCount: 0 };
      store[a.id] = { ok: a.ok, tries: prev.tries + 1,
                      okCount: prev.okCount + (a.ok ? 1 : 0) };
    });
  }
  document.getElementById('again').addEventListener('click', function () {
    idx = 0; answers = []; reported = false;
    timerStart = (SESSION && SESSION.timed) ? Date.now() : 0;
    render(); window.scrollTo(0, 0);
  });
  var menuBtn = document.getElementById('menu');
  if (menuBtn) menuBtn.addEventListener('click', function () {
    renderMenu(); window.scrollTo(0, 0);
  });
  var redo = document.getElementById('redo');
  if (redo) redo.addEventListener('click', function () {
    var ids = missed.map(function (i) { return DATA.qcm[i].id; });
    var qs = currentSet().qcm;
    selection = [];
    qs.forEach(function (q, i) { if (ids.indexOf(q.id) >= 0) selection.push(i); });
    startQuiz();
  });
  Array.prototype.forEach.call(shell.querySelectorAll('[data-jump]'), function (a) {
    a.addEventListener('click', function () {
      idx = parseInt(a.getAttribute('data-jump'), 10); render(); window.scrollTo(0, 0);
    });
  });
  var rev = document.getElementById('review');
  if (rev) rev.addEventListener('click', function () {
    if (!bridge) return;
    var lines = missed.map(function (i) {
      var q = DATA.qcm[i], d = document.createElement('div');
      d.innerHTML = q.question;
      var mine = answers[i].chosen >= 0 ? LETTERS[answers[i].chosen] : 'aucune';
      return '- ' + d.innerText.trim() + '  (ma réponse : ' + mine + ', correcte : ' + LETTERS[q.answer] + ')';
    });
    bridge.askAbout("Je viens de rater ces questions du QCM. Explique-moi ce que je n'ai visiblement "
      + "pas compris, en allant à la racine de la confusion plutot qu'en corrigeant question par question :\n\n"
      + lines.join('\n'), 'QCM');
  });
}

/** Score du cours apres enregistrement, pousse par l'application. */
window.showCourseScore = function (pct, correct, answered, total) {
  var box = document.getElementById('coursescore');
  if (!box) return;
  box.innerHTML = '<div class="course-score">Score du cours : <b>' + pct + ' %</b>'
    + ' &nbsp;·&nbsp; ' + correct + ' questions justes sur ' + answered + ' tentées'
    + (answered < total ? ' &nbsp;·&nbsp; ' + (total - answered) + ' jamais faites' : '')
    + '</div>';
};
window.setTheme = function (t) { document.documentElement.setAttribute('data-theme', t); };
window.restartQuiz = function () { renderMenu(); window.scrollTo(0, 0); };
selection = currentSet().qcm.map(function (_q, i) { return i; });

/* Seance (revisions, quiz du jour, defi...) laissee en plan : on propose de la
   reprendre au lieu de repartir de zero. */
function renderSessionResume(state) {
  var info = restorable(state, currentSet().qcm);
  shell.classList.add('resume-only');
  shell.innerHTML = resumeBoxHtml(state, info);
  wireResumeBox(state, info, function () {
    shell.classList.remove('resume-only');
    timerStart = SESSION.timed ? Date.now() : 0;
    startQuiz();
    window.scrollTo(0, 0);
  });
}

if (SESSION && SESSION.autostart && PROGRESS[currentSet().id]) {
  renderSessionResume(PROGRESS[currentSet().id]);
} else if (SESSION && SESSION.autostart) {
  timerStart = SESSION.timed ? Date.now() : 0;
  startQuiz();
} else {
  renderMenu();
}
</script>
