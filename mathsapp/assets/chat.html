<!DOCTYPE html>
<html lang="fr" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="__ASSETS__/vendor/katex/katex.min.css">
<link rel="stylesheet" href="__ASSETS__/course.css">
<style>
  body { font-size: 14.5px; line-height: 1.62; }
  #log { padding: 14px 16px 26px; max-width: 100%; }
  .msg { margin: 0 0 14px; }
  .msg .who {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 5px;
  }
  .msg.user .bubble {
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .62em .9em;
    white-space: pre-wrap;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: .95em;
  }
  .msg.user .who { color: var(--accent); }
  .msg.assistant .bubble > :first-child { margin-top: 0; }
  .msg.assistant .bubble > :last-child { margin-bottom: 0; }
  .msg.assistant h4 { margin: 1.1em 0 .35em; font-size: 1em; }
  .msg.error .bubble {
    border-left: 3px solid #dc2626; background: var(--warn-soft);
    padding: .6em .9em; border-radius: 8px; font-size: .92em;
  }
  .box { margin: 1em 0; padding: .8em 1em; }
  .katex-display { margin: .8em 0; }
  #empty {
    padding: 30px 20px; color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
    text-align: center; line-height: 1.7;
  }
  .cursor {
    display: inline-block; width: 7px; height: 1em; vertical-align: -2px;
    background: var(--accent); animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* assistant : actions proposees, a valider d'un clic */
  .actions { margin: -4px 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .action {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 9px; padding: .6em .85em;
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px;
  }
  .action .t { font-weight: 650; }
  .action .d { color: var(--muted); font-size: 12px; margin: 3px 0 0; }
  .action .row { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .action button {
    font: inherit; font-size: 12.5px; padding: 4px 13px; border-radius: 7px;
    border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer;
  }
  .action button.secondary { background: transparent; color: var(--accent); }
  .action button:disabled { opacity: .5; cursor: default; }
  .action .s { font-size: 12px; color: var(--muted); }
  .action.done { border-left-color: #0f9d76; }
  .action.done .s { color: #0f9d76; }
  .action.failed { border-left-color: #dc2626; }
  .action.failed .s { color: #dc2626; }
  .action.waiting { border-left-color: #d97706; }
  .action.waiting .s { color: #d97706; }
  .action.ignored, .action.invalid { opacity: .65; border-left-color: var(--line); }
  .action.invalid .s { color: #b45309; }
  .action button.ignore {
    background: transparent; border-color: transparent; color: var(--muted); padding: 4px 6px;
  }
  .work {
    font-family: ui-monospace, "DejaVu Sans Mono", monospace; font-size: 11.5px;
    color: var(--muted); white-space: pre-wrap; max-height: 240px; overflow: auto;
    border: 1px solid var(--line); border-radius: 8px; padding: .5em .7em; margin-top: .4em;
  }
  .msg pre { white-space: pre-wrap; font-size: 11.5px; max-height: 260px; overflow: auto; }
</style>
<script src="__ASSETS__/vendor/katex/katex.min.js"></script>
<script src="__ASSETS__/vendor/katex/contrib/auto-render.min.js"></script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
<div id="log"><div id="empty">__EMPTY__</div></div>
<script>
var MACROS = {
  '\\R': '\\mathbb{R}', '\\N': '\\mathbb{N}', '\\Z': '\\mathbb{Z}',
  '\\Q': '\\mathbb{Q}', '\\C': '\\mathbb{C}', '\\E': '\\mathbb{E}',
  '\\P': '\\mathbb{P}', '\\1': '\\mathbf{1}',
  '\\norm': '\\left\\lVert #1 \\right\\rVert', '\\abs': '\\left| #1 \\right|',
  '\\scal': '\\left\\langle #1 , #2 \\right\\rangle',
  '\\argmin': '\\operatorname{arg\\,min}', '\\argmax': '\\operatorname{arg\\,max}',
  '\\Var': '\\operatorname{Var}', '\\Cov': '\\operatorname{Cov}',
  '\\rank': '\\operatorname{rang}', '\\tr': '\\operatorname{tr}',
  '\\diag': '\\operatorname{diag}', '\\Id': '\\mathrm{Id}',
  '\\dd': '\\mathrm{d}', '\\eps': '\\varepsilon'
};
function typeset(node) {
  if (typeof renderMathInElement === 'undefined') return;
  renderMathInElement(node, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '\\[', right: '\\]', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false}
    ],
    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
    throwOnError: false, strict: false, output: 'html', macros: MACROS
  });
}
var log = document.getElementById('log');
var current = null, buffer = '', pending = false;

function dropEmpty() {
  var e = document.getElementById('empty');
  if (e) e.remove();
}
function atBottom() {
  return window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
}
function toBottom(force) {
  if (force || atBottom()) window.scrollTo(0, document.body.scrollHeight);
}
function makeMsg(role, label) {
  dropEmpty();
  var d = document.createElement('div');
  d.className = 'msg ' + role;
  var w = document.createElement('div');
  w.className = 'who';
  w.textContent = label;
  var b = document.createElement('div');
  b.className = 'bubble';
  d.appendChild(w); d.appendChild(b);
  log.appendChild(d);
  return b;
}
window.chatAdd = function (role, html) {
  var b = makeMsg(role, role === 'user' ? 'Vous' : (role === 'error' ? 'Erreur' : 'Claude'));
  b.innerHTML = html;
  typeset(b);   // l'utilisateur ecrit aussi du LaTeX (demonstrations redigees)
  toBottom(true);
};
window.chatBegin = function () {
  current = makeMsg('assistant', 'Claude');
  buffer = '';
  current.innerHTML = '<span class="cursor"></span>';
  toBottom(true);
};
var lastTypeset = 0;
window.chatDelta = function (chunk) {
  if (!current) window.chatBegin();
  buffer += chunk;
  if (pending) return;
  pending = true;
  requestAnimationFrame(function () {
    pending = false;
    var stick = atBottom();
    current.innerHTML = buffer + '<span class="cursor"></span>';
    // On typographie aussi pendant la reception : sinon on lit du LaTeX brut
    // pendant toute la duree d'une reponse longue. Throttle pour ne pas
    // reparser la reponse entiere a chaque fragment.
    var now = Date.now();
    if (now - lastTypeset > 400) {
      lastTypeset = now;
      typeset(current);
    }
    toBottom(stick);
  });
};
window.chatEnd = function () {
  if (!current) return;
  current.innerHTML = buffer;
  typeset(current);
  current = null; buffer = ''; lastTypeset = 0;
  toBottom(false);
};
// Remplace la bulle en cours par la version nettoyee cote application, pour
// que l'affichage soit identique a ce qui sera rejoue depuis l'historique.
window.chatFinalize = function (html) {
  if (!current) { window.chatAdd('assistant', html); return; }
  current.innerHTML = html;
  typeset(current);
  current = null; buffer = ''; lastTypeset = 0;
  toBottom(false);
};
window.chatError = function (msg) {
  if (current) { current.parentElement.remove(); current = null; buffer = ''; }
  window.chatAdd('error', msg);
};
window.chatReset = function (emptyText) {
  log.innerHTML = '<div id="empty">' + (emptyText || '') + '</div>';
  current = null; buffer = '';
};
window.setTheme = function (t) { document.documentElement.setAttribute('data-theme', t); };

// ---- assistant : cartes d'action et journal d'une modification du code
var bridge = null;
if (typeof QWebChannel !== 'undefined' && window.qt && window.qt.webChannelTransport) {
  new QWebChannel(window.qt.webChannelTransport, function (channel) {
    bridge = channel.objects.app || null;
    window.app = bridge;
  });
}
window.chatActions = function (list) {
  if (!list || !list.length) return;
  dropEmpty();
  var wrap = document.createElement('div');
  wrap.className = 'actions';
  list.forEach(function (a) {
    var card = document.createElement('div');
    card.className = 'action';
    card.id = 'action-' + a.id;
    var t = document.createElement('div');
    t.className = 't'; t.textContent = a.label;
    card.appendChild(t);
    if (a.detail) {
      var d = document.createElement('div');
      d.className = 'd'; d.textContent = a.detail;
      card.appendChild(d);
    }
    var row = document.createElement('div');
    row.className = 'row';
    var b = document.createElement('button');
    b.textContent = a.button || (a.costly ? 'Lancer' : 'Faire');
    b.onclick = function () {
      if (!bridge) return;
      window.chatActionState(a.id, 'running', 'en cours…');
      bridge.runAction(a.id);
    };
    b.className = (a.secondary ? 'secondary ' : '') + 'go';
    var ig = document.createElement('button');
    ig.className = 'ignore';
    ig.textContent = 'Ignorer';
    ig.title = 'Écarter cette proposition';
    ig.onclick = function () {
      if (bridge && bridge.ignoreAction) bridge.ignoreAction(a.id);
    };
    var s = document.createElement('span');
    s.className = 's';
    row.appendChild(b); row.appendChild(ig); row.appendChild(s);
    card.appendChild(row);
    wrap.appendChild(card);
  });
  log.appendChild(wrap);
  // chaque carte a son propre etat (rendu depuis l'historique enregistre)
  list.forEach(function (a) {
    window.chatActionState(a.id, a.state || '', a.note || '');
  });
  toBottom(true);
};
// etats : proposed (ou vide), validated, running, waiting, done, failed,
// ignored, invalid. Seules proposed et failed laissent le bouton actif.
var STATES = ['done', 'failed', 'running', 'validated', 'waiting', 'ignored', 'invalid'];
window.chatActionState = function (id, state, text) {
  var card = document.getElementById('action-' + id);
  if (!card) return;
  STATES.forEach(function (c) { card.classList.remove(c); });
  if (state === 'validated') state = 'running';
  if (state && state !== 'proposed') card.classList.add(state);
  card.querySelector('.s').textContent = text || '';
  var open = (!state || state === 'proposed' || state === 'failed');
  card.querySelector('button.go').disabled = !open;
  card.querySelector('button.ignore').style.display = open ? '' : 'none';
};
var work = null;
window.chatWorkBegin = function (title) {
  var b = makeMsg('assistant', 'Modification du code');
  var p = document.createElement('p');
  p.textContent = title;
  work = document.createElement('div');
  work.className = 'work';
  b.appendChild(p); b.appendChild(work);
  toBottom(true);
};
window.chatWorkLine = function (line) {
  if (!work) return;
  work.textContent += line + '\n';
  work.scrollTop = work.scrollHeight;
  toBottom(false);
};
window.chatWorkEnd = function (html) {
  work = null;
  window.chatAdd('assistant', html);
};

// liens vers les cours dans les reponses : ouvrir le cours, a la bonne section
document.addEventListener('click', function (ev) {
  var link = ev.target && ev.target.closest ? ev.target.closest('a.course-ref') : null;
  if (!link) return;
  ev.preventDefault();
  var id = link.getAttribute('data-course');
  var section = link.getAttribute('data-section') || '';
  if (!bridge || !id) return;
  if (section && bridge.openCourseAt) bridge.openCourseAt(id, section);
  else if (bridge.openCourse) bridge.openCourse(id);
});
</script>
</body>
</html>
