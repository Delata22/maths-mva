<!DOCTYPE html>
<html lang="fr" data-theme="__THEME__">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="__ASSETS__/vendor/katex/katex.min.css">
<link rel="stylesheet" href="__ASSETS__/course.css">
<style>
  body { font-size: 15.5px; overflow: hidden; }
  #split { display: flex; height: 100vh; }
  #list {
    flex: 0 0 268px; border-right: 1px solid var(--line); background: var(--bg-soft);
    overflow-y: auto; padding: 14px 10px 30px;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  #list .lt {
    font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); padding: 0 8px 10px;
  }
  .pitem {
    padding: 10px 11px; border-radius: 9px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .pitem:hover { background: var(--bg); }
  .pitem.on { background: var(--bg); border-color: var(--line-strong); }
  .pitem .pt { font-size: 13.5px; font-weight: 550; line-height: 1.35; }
  .pitem .pm {
    display: flex; align-items: center; gap: 8px; margin-top: 5px;
    font-size: 11.5px; color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); flex: none; }
  .dot.wip { background: var(--warn); }
  .dot.done { background: var(--ok); }
  #pane { flex: 1; overflow-y: auto; padding: 30px 34px 100px; }
  #pane .inner { max-width: 700px; }
  .ptitle { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 1.5em; font-weight: 680; margin: 0 0 4px; }
  .pmeta { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; margin-bottom: 22px; }
  .stmt {
    border-left: 3px solid var(--violet); background: var(--violet-soft);
    padding: 14px 17px; border-radius: 10px; margin-bottom: 26px;
  }
  .stmt > :first-child { margin-top: 0; } .stmt > :last-child { margin-bottom: 0; }
  .sect { margin: 26px 0 0; }
  .sect > h4 {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8em; font-weight: 700;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .hint {
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; margin-bottom: 8px;
    background: var(--bg-soft);
  }
  .hint .hl {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: var(--warn); margin-bottom: 4px;
  }
  .hint > .body > :first-child { margin-top: 0; } .hint > .body > :last-child { margin-bottom: 0; }
  .step { margin: 0 0 14px; padding-left: 14px; border-left: 2px solid var(--line-strong); }
  .step .sl {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: .8em; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px;
  }
  .step > .body > :first-child { margin-top: 0; } .step > .body > :last-child { margin-bottom: 0; }
  button.btn {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600;
    padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--bg-soft); color: var(--fg); cursor: pointer;
  }
  button.btn:hover { border-color: var(--accent); color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.primary:hover { filter: brightness(1.08); color: #fff; }
  button.btn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .statusbar {
    margin: 0 0 24px; padding: 0 0 16px;
    border-bottom: 1px solid var(--line);
  }
  #empty { padding: 80px 30px; text-align: center; color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif; }

  /* ------------------------------------------------------ redaction */
  .palette { margin-bottom: 8px; }
  .pal-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .pal-tab {
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer;
  }
  .pal-tab:hover { color: var(--fg); border-color: var(--line-strong); }
  .pal-tab.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pal-keys {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg-soft);
  }
  .pal-key {
    min-width: 34px; height: 30px; padding: 0 7px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 7px; background: var(--bg);
    cursor: pointer; font-size: 14px; color: var(--fg);
  }
  .pal-key:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pal-key .katex { font-size: 1em; }
  #draft {
    width: 100%; min-height: 240px; resize: vertical;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 13.5px; line-height: 1.65;
    padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line-strong); background: var(--bg); color: var(--fg);
    tab-size: 2;
  }
  #draft:focus { outline: none; border-color: var(--accent); }
  .edrow { margin-top: 10px; }
  .hintlbl { color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
  .autolbl {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px;
    cursor: pointer;
  }
  #previewbox {
    margin-top: 12px; padding: 14px 16px; border-radius: 10px;
    border: 1px dashed var(--line-strong); background: var(--bg-soft);
    white-space: pre-wrap;
  }
  #previewbox:empty { display: none; }
  #previewbox .katex-display { white-space: normal; margin: .5em 0; }
  .orphan {
    white-space: normal; margin: -4px 0 12px; padding: 8px 11px;
    border-left: 3px solid var(--warn); background: var(--warn-soft);
    border-radius: 7px; font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 12.5px; color: var(--fg-soft);
  }
  .orphan .btn { padding: 3px 9px; font-size: 12px; margin-left: 6px; }
  .keyhelp {
    margin-top: 8px; color: var(--muted);
    font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; line-height: 1.6;
  }
  .keyhelp code {
    background: var(--code-bg); padding: .1em .35em; border-radius: 4px; font-size: .92em;
  }
</style>

<body>
<div id="split"><div id="list"></div><div id="pane"><div id="empty">Choisissez une démonstration.</div></div></div>
<script>
var DATA = __DATA__;
var STATUS = __STATUS__;
var DRAFTS = __DRAFTS__;
var bridge = null, cur = -1;
var MACROS = {
  '\\R': '\\mathbb{R}', '\\N': '\\mathbb{N}', '\\Z': '\\mathbb{Z}',
  '\\Q': '\\mathbb{Q}', '\\C': '\\mathbb{C}', '\\E': '\\mathbb{E}',
  '\\P': '\\mathbb{P}', '\\1': '\\mathbf{1}',
  '\\norm': '\\left\\lVert #1 \\right\\rVert', '\\abs': '\\left| #1 \\right|',
  '\\scal': '\\left\\langle #1 , #2 \\right\\rangle',
  '\\argmin': '\\operatorname{arg\\,min}', '\\argmax': '\\operatorname{arg\\,max}',
  '\\Var': '\\operatorname{Var}', '\\Cov': '\\operatorname{Cov}',
  '\\rank': '\\operatorname{rang}', '\\tr': '\\operatorname{tr}',
  '\\diag': '\\operatorname{diag}', '\\Id': '\\mathrm{Id}',
  '\\dd': '\\mathrm{d}', '\\eps': '\\varepsilon'
};
function typeset(n) {
  if (typeof renderMathInElement === 'undefined') return;
  renderMathInElement(n, {
    delimiters: [{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},
                 {left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],
    ignoredTags: ['script','noscript','style','textarea','pre','code'],
    throwOnError: false, strict: false, output: 'html', macros: MACROS
  });
}
if (typeof QWebChannel !== 'undefined' && window.qt && window.qt.webChannelTransport) {
  new QWebChannel(window.qt.webChannelTransport,
    function (ch) { bridge = ch.objects.app; window.app = bridge; });
}
function esc(s) { return String(s).replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function stars(n) { return '★'.repeat(n) + '☆'.repeat(Math.max(0, 5 - n)); }

// ------------------------------------------------------------- palette
var PALETTE = [
  ['Logique', [
    ['\\forall', '\\forall #'], ['\\exists', '\\exists #'], ['\\nexists', '\\nexists #'],
    ['\\neg', '\\neg #'], ['\\land', ' \\land '], ['\\lor', ' \\lor '],
    ['\\Rightarrow', ' \\Rightarrow '], ['\\Leftarrow', ' \\Leftarrow '],
    ['\\iff', ' \\iff '], ['\\mid', ' \\mid '],
    ['\\equiv', ' \\equiv '], ['\\not\\equiv', ' \\not\\equiv '],
    ['\\oplus', ' \\oplus '], ['\\vdash', ' \\vdash '],
    ['\\models', ' \\models '], ['a \\bmod n', ' \\pmod{#}'],
    ['\\top', '\\top'], ['\\bot', '\\bot'], ['\\square', '\\square']
  ]],
  ['Ensembles', [
    ['\\in', ' \\in '], ['\\notin', ' \\notin '], ['\\subset', ' \\subset '],
    ['\\subseteq', ' \\subseteq '], ['\\supset', ' \\supset '],
    ['\\cup', ' \\cup '], ['\\cap', ' \\cap '], ['\\setminus', ' \\setminus '],
    ['\\emptyset', '\\emptyset'], ['\\times', ' \\times '],
    ['\\subsetneq', ' \\subsetneq '], ['\\sqcup', ' \\sqcup '],
    ['\\mathcal{P}(E)', '\\mathcal{P}(#)'], ['\\complement', '\\complement '],
    ['\\{\\}', '\\{ # \\}'], ['\\mathbb{R}', '\\R'], ['\\mathbb{N}', '\\N'],
    ['\\mathbb{Z}', '\\Z'], ['\\mathbb{Q}', '\\Q'], ['\\mathbb{C}', '\\C'],
    ['\\mathbb{E}', '\\E'], ['\\mathbb{P}', '\\P']
  ]],
  ['Analyse', [
    ['\\to', ' \\to '], ['\\mapsto', ' \\mapsto '], ['\\infty', '\\infty'],
    ['\\leq', ' \\leq '], ['\\geq', ' \\geq '], ['\\neq', ' \\neq '],
    ['\\approx', ' \\approx '], ['\\sim', ' \\sim '], ['\\ll', ' \\ll '],
    ['\\simeq', ' \\simeq '], ['\\propto', ' \\propto '],
    ['\\lim_{n}', '\\lim_{# \\to +\\infty} '], ['\\sum_{}^{}', '\\sum_{#}^{} '],
    ['\\prod_{}^{}', '\\prod_{#}^{} '], ['\\int_{}^{}', '\\int_{#}^{} '],
    ['\\partial', '\\partial '], ['\\nabla', '\\nabla '], ['\\varepsilon', '\\eps'],
    ['\\delta', '\\delta '], ['\\lVert x\\rVert', '\\norm{#}'], ['|x|', '\\abs{#}'],
    ['\\langle x,y\\rangle', '\\scal{#}{}'], ['\\circ', ' \\circ ']
  ]],
  ['Algebre', [
    ['A^{\\mathsf T}', '^{\\mathsf T}'], ['A^{-1}', '^{-1}'],
    ['\\dim', '\\dim '], ['\\operatorname{rg}', '\\rank '],
    ['\\ker', '\\ker '], ['\\operatorname{Im}', '\\operatorname{Im} '],
    ['\\operatorname{tr}', '\\tr '], ['\\det', '\\det '],
    ['\\oplus', ' \\oplus '], ['\\otimes', ' \\otimes '],
    ['\\operatorname{Vect}', '\\operatorname{Vect}(#)'],
    ['\\begin{pmatrix}a\\end{pmatrix}', '\\begin{pmatrix} # \\end{pmatrix}']
  ]],
  ['Grec', [
    ['\\Phi', '\\Phi '], ['\\Psi', '\\Psi '], ['\\alpha', '\\alpha '],
    ['\\beta', '\\beta '], ['\\gamma', '\\gamma '],
    ['\\delta', '\\delta '], ['\\varepsilon', '\\eps'], ['\\zeta', '\\zeta '],
    ['\\eta', '\\eta '], ['\\theta', '\\theta '], ['\\lambda', '\\lambda '],
    ['\\mu', '\\mu '], ['\\nu', '\\nu '], ['\\xi', '\\xi '], ['\\pi', '\\pi '],
    ['\\rho', '\\rho '], ['\\sigma', '\\sigma '], ['\\tau', '\\tau '],
    ['\\varphi', '\\varphi '], ['\\chi', '\\chi '], ['\\psi', '\\psi '],
    ['\\omega', '\\omega '], ['\\Gamma', '\\Gamma '], ['\\Delta', '\\Delta '],
    ['\\Lambda', '\\Lambda '], ['\\Sigma', '\\Sigma '], ['\\Omega', '\\Omega ']
  ]],
  ['Structure', [
    ['\\$x\\$', '$#$'], ['\\$\\$x\\$\\$', '$$\n#\n$$'], ['\\frac{a}{b}', '\\frac{#}{}'],
    ['\\sqrt{x}', '\\sqrt{#}'], ['x^{n}', '^{#}'], ['x_{i}', '_{#}'],
    ['\\begin{cases}a\\end{cases}', '\\begin{cases} # \\\\ \\end{cases}'],
    ['\\text{texte}', '\\text{#}'], ['\\quad', ' \\quad '],
    ['\\dots', '\\dots '], ['\\left(\\right)', '\\left( # \\right)']
  ]]
];

var SHORTCUTS = {
  a: '\\forall #', e: '\\exists #', i: ' \\in ', r: ' \\Rightarrow ', q: ' \\iff ',
  u: ' \\cup ', n: ' \\cap ', o: '\\emptyset', d: '\\delta ', p: '\\partial ',
  g: '\\nabla ', l: '\\lim_{# \\to +\\infty} ', s: '\\sum_{#}^{} ',
  t: '\\int_{#}^{} ', f: '\\frac{#}{}', w: '\\norm{#}', m: '$#$'
};

var AUTO = {
  '=>': '\\Rightarrow', '<=>': '\\iff', 'ssi': '\\iff', '!=': '\\neq',
  '>=': '\\geq', '<=': '\\leq', '->': '\\to', '|->': '\\mapsto',
  'inf': '\\infty', 'qqs': '\\forall', 'ex': '\\exists'
};

/** Le curseur est-il a l'interieur d'une zone mathematique ? */
function insideMath(text, pos) {
  var i = 0, state = 'text';
  while (i < pos) {
    if (text[i] === '\\') { i += 2; continue; }      // \$ echappe
    if (text[i] === '$') {
      if (text[i + 1] === '$') {
        state = (state === 'display') ? 'text' : 'display';
        i += 2; continue;
      }
      state = (state === 'inline') ? 'text' : 'inline';
    }
    i++;
  }
  return state !== 'text';
}

/** Un fragment qui a besoin d'etre entoure de $ pour etre compose. */
function isMathSnippet(tpl) {
  return tpl.indexOf('$') === -1 && /\\[a-zA-Z]|[\^_{}]/.test(tpl);
}

function insert(tpl) {
  var ta = document.getElementById('draft');
  if (!ta) return;
  var start = ta.selectionStart, end = ta.selectionEnd;
  var selected = ta.value.slice(start, end);

  // Un symbole insere hors des delimiteurs ne serait jamais compose : on
  // ouvre la zone mathematique a la place de l'utilisateur. Et si le curseur
  // sort tout juste d'une zone, on la prolonge au lieu d'en ouvrir une
  // seconde : deux insertions de suite doivent donner $a b$, pas $a$$b$.
  var head = start;
  if (isMathSnippet(tpl) && !insideMath(ta.value, start)) {
    var merge = start > 0 && ta.value[start - 1] === '$'
                && insideMath(ta.value, start - 1);
    var snippet = tpl.replace(/^ | $/g, '');
    if (merge) {
      head = start - 1;                       // on retire le $ fermant
      tpl = ' ' + snippet + '$';
    } else {
      tpl = '$' + snippet + '$';
    }
  }

  var caret = tpl.indexOf('#');
  var text = caret === -1 ? tpl : tpl.replace('#', selected);
  ta.value = ta.value.slice(0, head) + text + ta.value.slice(end);
  start = head;
  var pos = caret === -1 ? start + text.length
                         : start + caret + selected.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  ta.dispatchEvent(new Event('input'));
}

function buildPalette(host) {
  var tabs = document.createElement('div');
  tabs.className = 'pal-tabs';
  var keys = document.createElement('div');
  keys.className = 'pal-keys';
  host.appendChild(tabs);
  host.appendChild(keys);

  function show(index) {
    keys.innerHTML = '';
    Array.prototype.forEach.call(tabs.children, function (t, i) {
      t.classList.toggle('on', i === index);
    });
    PALETTE[index][1].forEach(function (entry) {
      var b = document.createElement('button');
      b.className = 'pal-key';
      b.type = 'button';
      b.title = entry[1].replace('#', '…');
      try {
        b.innerHTML = katex.renderToString(entry[0], {throwOnError: false, output: 'html'});
      } catch (err) { b.textContent = entry[0]; }
      b.addEventListener('mousedown', function (ev) { ev.preventDefault(); });
      b.addEventListener('click', function () { insert(entry[1]); });
      keys.appendChild(b);
    });
  }
  PALETTE.forEach(function (group, i) {
    var t = document.createElement('button');
    t.className = 'pal-tab';
    t.type = 'button';
    t.textContent = group[0];
    t.addEventListener('click', function () { show(i); });
    tabs.appendChild(t);
  });
  show(0);
}

function previewHtml(text) {
  // Le texte reste dans un seul noeud, mis en forme par white-space: pre-wrap.
  // Decouper en <p> et <br> cassait les formules centrees ecrites sur
  // plusieurs lignes : KaTeX n'apparie pas deux $$ separes par un element.
  return text.replace(/[&<>]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c];
  });
}

/** Commandes LaTeX ecrites hors de toute zone mathematique. */
function orphanCommands(text) {
  var out = [], re = /\\[a-zA-Z]+/g, m;
  while ((m = re.exec(text)) !== null) {
    if (!insideMath(text, m.index) && out.indexOf(m[0]) === -1) out.push(m[0]);
  }
  return out;
}

function renderPreview() {
  var box = document.getElementById('previewbox');
  var ta = document.getElementById('draft');
  if (!box || !ta || !box.classList.contains('open')) return;
  var text = ta.value.trim();
  if (!text) {
    box.innerHTML = '<span style="color:var(--muted)">Rien à afficher.</span>';
    return;
  }
  var orphans = orphanCommands(ta.value);
  var warn = '';
  if (orphans.length) {
    warn = '<div class="orphan">' + orphans.slice(0, 6).map(esc).join(', ')
      + (orphans.length > 6 ? '…' : '')
      + ' — écrit hors des délimiteurs, donc affiché tel quel. '
      + '<button class="btn" id="wrapmath">Entourer de $…$</button></div>';
  }
  box.innerHTML = warn + previewHtml(ta.value);
  typeset(box);
  var fix = document.getElementById('wrapmath');
  if (fix) fix.addEventListener('click', wrapOrphans);
}

/** Entoure de $ … $ les suites de commandes laissees hors zone mathematique. */
function wrapOrphans() {
  var ta = document.getElementById('draft');
  if (!ta) return;
  var src = ta.value, out = '', i = 0;
  while (i < src.length) {
    if (src[i] === '\\' && /[a-zA-Z]/.test(src[i + 1] || '')
        && !insideMath(src, i)) {
      // on avale la suite : commandes, symboles et espaces qui les separent
      var j = i;
      while (j < src.length) {
        var rest = src.slice(j);
        var token = rest.match(/^(\\[a-zA-Z]+|[A-Za-z0-9]|[\^_{}()\[\],.+\-*\/=<>|]|\s(?=\S))/);
        if (!token) break;
        j += token[0].length;
      }
      var chunk = src.slice(i, j).replace(/\s+$/, '');
      out += '$' + chunk + '$';
      i = i + chunk.length;
    } else {
      out += src[i];
      i++;
    }
  }
  ta.value = out;
  ta.dispatchEvent(new Event('input'));
  renderPreview();
}

function renderList() {
  var h = '<div class="lt">Démonstrations à faire</div>';
  DATA.proofs.forEach(function (p, i) {
    var s = STATUS[p.id] || 'todo';
    h += '<div class="pitem' + (i === cur ? ' on' : '') + '" data-i="' + i + '">'
      + '<div class="pt">' + p.title + '</div>'
      + '<div class="pm"><span class="dot ' + (s === 'done' ? 'done' : s === 'wip' ? 'wip' : '') + '"></span>'
      + '<span>' + stars(p.difficulty) + '</span>'
      + ((DRAFTS[p.id] || '').trim() ? '<span title="brouillon commencé">✎</span>' : '')
      + '</div></div>';
  });
  var l = document.getElementById('list');
  l.innerHTML = h;
  typeset(l);
  Array.prototype.forEach.call(l.querySelectorAll('.pitem'), function (el) {
    el.addEventListener('click', function () { open(parseInt(el.getAttribute('data-i'), 10)); });
  });
}

function open(i) {
  cur = i;
  var p = DATA.proofs[i];
  var s = STATUS[p.id] || 'todo';
  var h = '<div class="inner">';
  h += '<h2 class="ptitle">' + p.title + '</h2>';
  h += '<div class="pmeta">Difficulté ' + stars(p.difficulty) + '</div>';
  h += '<div class="statusbar"><div class="row">'
    + '<span style="color:var(--muted);font-size:12.5px;margin-right:4px">Où en suis-je ?</span>'
    + '<button class="btn' + (s === 'todo' ? ' primary' : '') + '" data-st="todo">À faire</button>'
    + '<button class="btn' + (s === 'wip' ? ' primary' : '') + '" data-st="wip">En cours</button>'
    + '<button class="btn' + (s === 'done' ? ' on' : '') + '" data-st="done">Réussie</button>'
    + '</div></div>';
  h += '<div class="stmt">' + p.statement + '</div>';

  h += '<div class="sect"><h4>Cherchez d\'abord</h4>'
    + '<p style="color:var(--muted);font-size:.94em">Prenez le temps de chercher avant de reveler '
    + 'quoi que ce soit. Les indices vont du plus vague au plus explicite.</p>'
    + '<div class="row"><button class="btn" id="hint">Révéler un indice</button>'
    + '<span id="hintn" style="color:var(--muted);font-size:12.5px"></span></div>'
    + '<div id="hints" style="margin-top:12px"></div></div>';

  h += '<div class="sect"><h4>Squelette de la preuve</h4>'
    + '<div class="row"><button class="btn" id="sk">Afficher les étapes</button>'
    + '<button class="btn" id="walk">Décortiquer avec Claude</button></div>'
    + '<div id="steps" style="margin-top:14px"></div></div>';

  h += '<div class="sect" id="editor-sect"><h4>Ma démonstration</h4>'
    + '<div class="palette" id="palette"></div>'
    + '<textarea id="draft" spellcheck="false" placeholder="Rédigez ici. Les maths s\'écrivent en LaTeX entre $ ... $ — la palette ci-dessus insère les symboles, et Alt+lettre va plus vite."></textarea>'
    + '<div class="row edrow">'
    + '<button class="btn primary" id="review">Faire corriger par Claude</button>'
    + '<button class="btn" id="prev">Aperçu</button>'
    + '<label class="autolbl"><input type="checkbox" id="auto" checked> remplacements automatiques</label>'
    + '<span class="hintlbl" id="saved"></span>'
    + '</div>'
    + '<div id="previewbox"></div>'
    + '<div class="keyhelp">'
    + '<strong>Raccourcis</strong> — Alt+A <code>\\forall</code>, Alt+E <code>\\exists</code>, '
    + 'Alt+I <code>\\in</code>, Alt+R <code>\\Rightarrow</code>, Alt+Q <code>\\iff</code>, '
    + 'Alt+U <code>\\cup</code>, Alt+N <code>\\cap</code>, Alt+G <code>\\nabla</code>, '
    + 'Alt+F <code>\\frac</code>, Alt+S <code>\\sum</code>, Alt+T <code>\\int</code>, '
    + 'Alt+L <code>\\lim</code>, Alt+W <code>\\norm</code>, Alt+M entoure de <code>$…$</code>, '
    + 'Ctrl+Entrée envoie à la correction.<br>'
    + '<strong>Abréviations</strong> (suivies d\'une espace) — <code>=></code>, <code>&lt;=></code>, '
    + '<code>ssi</code>, <code>!=</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>-></code>, '
    + '<code>|-></code>, <code>inf</code>, <code>qqs</code>, <code>ex</code>.<br>'
    + '<strong>Macros</strong> — <code>\\R \\N \\Z \\Q \\C \\E \\P \\eps \\norm{} \\abs{} \\scal{}{} '
    + '\\rank \\tr \\Id \\argmin</code>.'
    + '</div></div>';

  h += '<div class="sect"><h4>Solution rédigée</h4>'
    + '<div class="row"><button class="btn" id="sol">Afficher la solution</button></div>'
    + '<div id="solution" style="margin-top:14px"></div></div>';

  h += '</div>';

  var pane = document.getElementById('pane');
  pane.innerHTML = h;
  pane.scrollTop = 0;
  typeset(pane);
  renderList();

  var shown = 0;
  var hintBtn = document.getElementById('hint');
  function updateHintLabel() {
    document.getElementById('hintn').textContent =
      shown + ' / ' + p.hints.length + ' indice' + (p.hints.length > 1 ? 's' : '');
    if (shown >= p.hints.length) { hintBtn.disabled = true; hintBtn.textContent = 'Plus d\'indice'; }
  }
  updateHintLabel();
  hintBtn.addEventListener('click', function () {
    if (shown >= p.hints.length) return;
    var d = document.createElement('div');
    d.className = 'hint';
    d.innerHTML = '<div class="hl">Indice ' + (shown + 1) + '</div><div class="body">' + p.hints[shown] + '</div>';
    document.getElementById('hints').appendChild(d);
    typeset(d);
    shown++;
    updateHintLabel();
  });

  document.getElementById('sk').addEventListener('click', function () {
    var box = document.getElementById('steps');
    if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'Afficher les étapes'; return; }
    var out = '';
    p.steps.forEach(function (st, k) {
      out += '<div class="step"><span class="sl">Etape ' + (k + 1) + ' &mdash; ' + esc(st.title) + '</span>'
        + '<div class="body">' + st.content + '</div></div>';
    });
    box.innerHTML = out || '<p style="color:var(--muted)">Pas de squelette fourni.</p>';
    typeset(box);
    this.textContent = 'Masquer les étapes';
  });

  document.getElementById('sol').addEventListener('click', function () {
    var box = document.getElementById('solution');
    if (box.innerHTML) { box.innerHTML = ''; this.textContent = 'Afficher la solution'; return; }
    box.innerHTML = p.solution;
    typeset(box);
    this.textContent = 'Masquer la solution';
  });

  // ------------------------------------------------------- redaction
  buildPalette(document.getElementById('palette'));
  var ta = document.getElementById('draft');
  var saved = document.getElementById('saved');
  var autoBox = document.getElementById('auto');
  ta.value = DRAFTS[p.id] || '';

  var saveTimer = null;
  function markSaving() {
    saved.textContent = ta.value.trim() ? 'enregistrement…' : '';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      DRAFTS[p.id] = ta.value;
      if (bridge) bridge.saveProofDraft(p.id, ta.value);
      saved.textContent = ta.value.trim()
        ? 'brouillon enregistré · ' + ta.value.trim().length + ' caractères' : '';
      renderList();
    }, 700);
  }
  ta.addEventListener('input', markSaving);

  ta.addEventListener('keydown', function (ev) {
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey) {
      var tpl = SHORTCUTS[ev.key.toLowerCase()];
      if (tpl) { ev.preventDefault(); insert(tpl); return; }
    }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter') {
      ev.preventDefault();
      document.getElementById('review').click();
      return;
    }
    if (ev.key === ' ' && autoBox.checked) {
      var pos = ta.selectionStart;
      if (pos !== ta.selectionEnd) return;
      var before = ta.value.slice(0, pos);
      var m = before.match(/([^\s]+)$/);
      if (!m) return;
      var repl = AUTO[m[1]];
      if (!repl) return;
      ev.preventDefault();
      var start = pos - m[1].length;
      var out = insideMath(ta.value, start) ? repl : '$' + repl + '$';
      ta.value = ta.value.slice(0, start) + out + ' ' + ta.value.slice(pos);
      var caret = start + out.length + 1;
      ta.setSelectionRange(caret, caret);
      markSaving();
    }
  });

  var previewTimer = null;
  document.getElementById('prev').addEventListener('click', function () {
    var box = document.getElementById('previewbox');
    if (box.classList.contains('open')) {
      box.classList.remove('open');
      box.innerHTML = '';
      this.textContent = 'Aperçu';
      return;
    }
    box.classList.add('open');
    renderPreview();
    this.textContent = 'Masquer l\'aperçu';
  });
  ta.addEventListener('input', function () {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 300);
  });

  document.getElementById('review').addEventListener('click', function () {
    if (!bridge) return;
    var text = ta.value.trim();
    if (!text) { ta.focus(); return; }
    clearTimeout(saveTimer);
    DRAFTS[p.id] = ta.value;
    bridge.saveProofDraft(p.id, ta.value);
    var tmp = document.createElement('div');
    tmp.innerHTML = p.statement;
    var sol = document.createElement('div');
    sol.innerHTML = p.solution;
    bridge.reviewProof(p.id, JSON.stringify({
      title: p.title,
      statement: tmp.innerText.trim(),
      solution: sol.innerText.trim().slice(0, 6000),
      attempt: text
    }));
  });

  if (ta.value.trim()) {
    saved.textContent = 'brouillon enregistré · ' + ta.value.trim().length + ' caractères';
  }

  document.getElementById('walk').addEventListener('click', function () {
    if (!bridge) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = '<p>Énoncé : ' + p.statement + '</p>'
      + p.steps.map(function (st) { return '<p>' + st.title + ' : ' + st.content + '</p>'; }).join('')
      + '<p>Solution : ' + p.solution + '</p>';
    bridge.openProofHelper(p.id, p.title, tmp.innerText.slice(0, 8000));
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-st]'), function (b) {
    b.addEventListener('click', function () {
      var v = b.getAttribute('data-st');
      STATUS[p.id] = v;
      if (bridge) bridge.setProofStatus(p.id, v);
      open(cur);
    });
  });
}

window.setTheme = function (t) { document.documentElement.setAttribute('data-theme', t); };
renderList();
if (DATA.proofs.length) open(0);
</script>
</body>
</html>
